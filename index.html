<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoldTracker | Today's Precious Metal Rates</title>
    <meta
      name="description"
      content="Live precious metal rates for gold, silver, and platinum with a premium, fast-loading experience."
    />
    <meta name="theme-color" content="#081217" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GoldTracker" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' x2='100%25' y1='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23f7e2a6'/%3E%3Cstop offset='100%25' stop-color='%23c7962d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23081217'/%3E%3Ccircle cx='32' cy='32' r='18' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./icons/apple-touch-icon.png"
    />
    <link
      rel="preconnect"
      href="https://api.lalithaajewellery.com"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-noise" aria-hidden="true"></div>

      <main class="dashboard" id="app" aria-live="polite">
        <section class="hero-panel skeleton-panel" aria-hidden="true">
          <div class="status-pill skeleton-block"></div>
          <div class="hero-copy">
            <div class="eyebrow skeleton-line short"></div>
            <div class="title skeleton-line long"></div>
            <div class="title skeleton-line medium"></div>
            <div class="hero-price skeleton-line price"></div>
            <div class="meta-row">
              <div class="skeleton-line meta"></div>
              <div class="skeleton-line meta short"></div>
            </div>
          </div>
        </section>

        <section class="rates-panel skeleton-panel" aria-hidden="true">
          <div class="panel-head">
            <div class="eyebrow skeleton-line short"></div>
            <div class="skeleton-line medium"></div>
          </div>

          <div class="supporting-grid">
            <article class="rate-card">
              <div class="skeleton-line short"></div>
              <div class="skeleton-line medium"></div>
              <div class="skeleton-line meta short"></div>
            </article>
            <article class="rate-card">
              <div class="skeleton-line short"></div>
              <div class="skeleton-line medium"></div>
              <div class="skeleton-line meta short"></div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <template id="dashboard-template">
      <section class="hero-panel">
        <div class="hero-surface">
          <div class="status-pill">
            <span class="pulse-dot"></span>
            <span data-bind="statusLabel"></span>
          </div>

          <div class="hero-copy">
            <p class="eyebrow" data-bind="todayLabel"></p>
            <h1 class="hero-title">Today's gold rate</h1>
            <p class="hero-subtitle">
              Live precious metal pricing for Karnataka with a focus on the
              latest published gold rate.
            </p>

            <div class="hero-price-row">
              <div>
                <p class="gold-purity-label">22K Gold price</p>
                <p class="hero-price" data-bind="goldPrice"></p>
                <p class="price-caption">Latest published 22K price per gram</p>
              </div>
              <div class="hero-ornament" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>

            <dl class="meta-grid">
              <div>
                <dt>Rate updated</dt>
                <dd data-bind="updatedTime"></dd>
              </div>
              <div>
                <dt>Location</dt>
                <dd data-bind="stateName"></dd>
              </div>
              <div class="estimate-card">
                <dt>Estimated 24K Gold</dt>
                <dd
                  class="estimate-card-price"
                  data-bind="goldTwentyFourKPrice"
                ></dd>
                <p class="estimate-card-note">
                  Estimated from the live 22K per-gram price
                </p>
                <div
                  class="estimate-breakdown"
                  aria-label="Estimated 24K gold weights"
                >
                  <div>
                    <span>10g</span>
                    <strong data-bind="goldTwentyFourKTenGramPrice"></strong>
                  </div>
                  <div>
                    <span>12g</span>
                    <strong data-bind="goldTwentyFourKTwelveGramPrice"></strong>
                  </div>
                </div>
              </div>
              <div>
                <dt>10 gram gold</dt>
                <dd data-bind="goldTenGramPrice"></dd>
              </div>
              <div>
                <dt>12 gram gold</dt>
                <dd data-bind="goldTwelveGramPrice"></dd>
              </div>
            </dl>
          </div>
        </div>
      </section>

      <section class="calculator-panel">
        <section
          class="buy-calculator-card"
          aria-label="Gold buy price calculator"
        >
          <div class="buy-calculator-head">
            <div>
              <p class="eyebrow">Gold buy price</p>
              <h2 class="buy-calculator-title">22K purchase calculator</h2>
            </div>
            <p class="buy-calculator-note">
              Includes compulsory 3% GST. Making charges default to 3% and can
              be adjusted.
            </p>
          </div>

          <div class="gram-tabs" role="tablist" aria-label="Gold gram presets">
            <button
              class="gram-tab is-active"
              type="button"
              data-grams-option="1"
              aria-selected="true"
            >
              1 gm
            </button>
            <button
              class="gram-tab"
              type="button"
              data-grams-option="2"
              aria-selected="false"
            >
              2 gm
            </button>
            <button
              class="gram-tab"
              type="button"
              data-grams-option="4"
              aria-selected="false"
            >
              4 gm
            </button>
            <button
              class="gram-tab"
              type="button"
              data-grams-option="custom"
              aria-selected="false"
            >
              Custom
            </button>
          </div>

          <label class="custom-grams-field hidden" id="custom-grams-field">
            <span>Custom grams</span>
            <input
              id="custom-grams-input"
              type="number"
              min="0.1"
              step="0.1"
              value="1"
              inputmode="decimal"
            />
          </label>

          <div class="calculator-controls">
            <label class="making-range-field">
              <span>Making charges slider</span>
              <input
                id="making-slider"
                type="range"
                min="0"
                max="20"
                step="0.1"
                value="3"
              />
              <small>Slider range: 0% to 20%</small>
            </label>

            <label class="making-input-field">
              <span>Making charges %</span>
              <input
                id="making-input"
                type="number"
                min="0"
                step="0.1"
                value="3"
                inputmode="decimal"
              />
            </label>
          </div>

          <div class="calculator-breakdown" aria-live="polite">
            <div>
              <span>Selected grams</span>
              <strong id="selected-grams-output">1 gm</strong>
            </div>
            <div>
              <span>Base gold price</span>
              <strong id="base-price-output"></strong>
            </div>
            <div>
              <span>GST (3%)</span>
              <strong id="gst-price-output"></strong>
            </div>
            <div>
              <span>Making charges</span>
              <strong id="making-price-output"></strong>
            </div>
            <div class="calculator-total-row">
              <span>Final gold buy price</span>
              <strong id="final-price-output"></strong>
            </div>
          </div>
        </section>

        <section
          class="buy-calculator-card"
          aria-label="Grams from price calculator"
        >
          <div class="buy-calculator-head">
            <div>
              <p class="eyebrow">Price to grams</p>
              <h2 class="buy-calculator-title">How many grams can I buy?</h2>
            </div>
            <p class="buy-calculator-note">
              Enter your budget. Compulsory 3% GST and adjustable making charges
              are deducted to find the gold weight.
            </p>
          </div>

          <label class="budget-price-field">
            <span>Budget amount (INR)</span>
            <input
              id="budget-price-input"
              type="number"
              min="1"
              step="1"
              value="10000"
              inputmode="decimal"
              placeholder="Enter budget in INR"
            />
          </label>

          <div class="calculator-controls">
            <label class="making-range-field">
              <span>Making charges slider</span>
              <input
                id="reverse-making-slider"
                type="range"
                min="0"
                max="20"
                step="0.1"
                value="3"
              />
              <small>Slider range: 0% to 20%</small>
            </label>

            <label class="making-input-field">
              <span>Making charges %</span>
              <input
                id="reverse-making-input"
                type="number"
                min="0"
                step="0.1"
                value="3"
                inputmode="decimal"
              />
            </label>
          </div>

          <div class="grams-result-panel" aria-live="polite">
            <span>Gold weight you can buy</span>
            <strong id="grams-from-price-output">— gm</strong>
          </div>

          <div class="calculator-breakdown">
            <div>
              <span>Budget</span>
              <strong id="budget-price-output"></strong>
            </div>
            <div>
              <span>Base gold price</span>
              <strong id="reverse-base-price-output"></strong>
            </div>
            <div>
              <span>GST (3%)</span>
              <strong id="reverse-gst-price-output"></strong>
            </div>
            <div>
              <span>Making charges</span>
              <strong id="reverse-making-price-output"></strong>
            </div>
          </div>
        </section>
      </section>

      <section class="rates-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Supporting rates</p>
            <h2 class="panel-title">Silver and platinum</h2>
          </div>
          <p class="panel-note" data-bind="panelNote"></p>
        </div>

        <div class="supporting-grid">
          <article class="rate-card silver-card">
            <p class="card-label">Silver</p>
            <p class="card-rate" data-bind="silverPrice"></p>
            <p class="card-time" data-bind="silverTime"></p>
          </article>

          <article class="rate-card platinum-card">
            <p class="card-label">Platinum</p>
            <p class="card-rate" data-bind="platinumPrice"></p>
            <p class="card-time" data-bind="platinumTime"></p>
          </article>
        </div>

        <div class="footer-bar">
          <p class="footer-copy" data-bind="cacheMessage"></p>
          <div class="footer-actions">
            <button
              class="install-button hidden"
              type="button"
              id="install-button"
            >
              Install app
            </button>
            <button class="refresh-button" type="button" id="refresh-button">
              Refresh rates
            </button>
          </div>
        </div>
      </section>
    </template>

    <template id="error-template">
      <section class="hero-panel error-panel">
        <div class="hero-surface">
          <div class="status-pill error-pill">
            <span class="pulse-dot"></span>
            <span>Connection issue</span>
          </div>

          <div class="hero-copy">
            <p class="eyebrow">Unable to load live pricing</p>
            <h1 class="hero-title">Rates are temporarily unavailable</h1>
            <p class="hero-subtitle" data-bind="errorMessage"></p>

            <div class="footer-bar compact">
              <p class="footer-copy">
                Try again to request the latest gold, silver, and platinum
                rates.
              </p>
              <button class="refresh-button" type="button" id="retry-button">
                Try again
              </button>
            </div>
          </div>
        </div>
      </section>
    </template>

    <script src="./config.js"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
